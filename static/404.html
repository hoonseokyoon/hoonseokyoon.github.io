<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>페이지를 찾을 수 없습니다 · Hoonseok Yoon</title>
    <style>
      :root {
        font-family:
          Pretendard,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        color: #30363d;
      }
      body {
        margin: 0;
        padding: 12vh max(1rem, 6vw);
      }
      main {
        max-width: 42rem;
      }
      h1 {
        color: #171b21;
        font-size: clamp(2rem, 6vw, 3.5rem);
        line-height: 1.15;
        letter-spacing: -0.04em;
      }
      p {
        line-height: 1.65;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem 1.25rem;
        margin-top: 2rem;
      }
      a {
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        color: #075ea8;
        font-weight: 650;
        text-underline-offset: 0.17em;
      }
      a:focus-visible {
        outline: 3px solid #7fb2dc;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p>404</p>
      <h1>페이지를 찾을 수 없습니다.</h1>
      <p>주소가 바뀌었거나 더 이상 제공되지 않는 페이지입니다.</p>
      <p lang="en">The address changed or this page is no longer available.</p>
      <nav aria-label="이동할 페이지">
        <a href="/ko/">한국어 홈</a>
        <a href="/en/" lang="en">English home</a>
        <a href="/tokamak/ko/">Tokamak</a>
      </nav>
    </main>
  </body>
</html>
