name: Deploy GitHub Pages (manual)

on:
  workflow_dispatch:
    inputs:
      publish_approved:
        description: Confirm that this exact default-branch revision is approved for public deployment
        required: true
        type: boolean
        default: false

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate publication request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Validate approval and source branch
        env:
          PUBLISH_APPROVED: ${{ inputs.publish_approved }}
          SOURCE_REF_NAME: ${{ github.ref_name }}
          SOURCE_REF_TYPE: ${{ github.ref_type }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if [[ "$PUBLISH_APPROVED" != "true" ]]; then
            echo "::error::publish_approved must be true"
            exit 1
          fi
          if [[ "$SOURCE_REF_TYPE" != "branch" || "$SOURCE_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "::error::Publication must be dispatched from the default branch"
            exit 1
          fi
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Workflow source SHA is not a full lowercase Git SHA"
            exit 1
          fi
          echo "actor=$GITHUB_ACTOR"
          echo "dispatched_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "publish_approved=$PUBLISH_APPROVED"
          echo "source_ref=$SOURCE_REF_NAME"
          echo "source_sha=$SOURCE_SHA"
          echo "workflow_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  build:
    name: Verify and package
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Verify checkout revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Verify release artifact
        run: npm run verify

      - name: Write exact release marker
        run: npm run write:release-marker -- --sha "$GITHUB_SHA"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./build
          include-hidden-files: true

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  verify-live:
    name: Verify deployed root and cross-site contracts
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Verify checkout revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify exact deployed release and cross-site contracts
        env:
          LIVE_BASE: ${{ needs.deploy.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: npm run check:live -- --base "$LIVE_BASE" --expected-sha "$EXPECTED_SHA"
